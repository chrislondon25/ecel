      #general_loader {

        border-color: #797979;
        background-color: #232323;
        margin-top: 30px;
      }

      .nar_spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #ccc;
        border-top-color: #000;
        border-radius: 50%;
        animation: nar_spin 0.8s linear infinite;
        display: none;
      }

      @keyframes nar_spin {

        }
